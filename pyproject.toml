[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sentinel-scan"
version = "0.1.0"
description = "A defensive website security scanner with safe defaults and clear, redacted reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Terence" }]
keywords = ["security", "scanner", "appsec", "defensive-security"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "defusedxml>=0.7.1,<1",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["bandit>=1.7", "pip-audit>=2.7", "pytest>=8", "ruff>=0.6"]

[project.scripts]
sentinel-scan = "sentinel_scan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_scan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S603"] # subprocess is called with a fixed argv and a validated host.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
